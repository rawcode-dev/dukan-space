name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pre-validation-and-audit:
    name: Pre-Validation, Security & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Dependency Hygiene & Security Verification
        run: python3 tool/verify_project.py

      - name: Code Formatting Verification
        run: dart format --output=none --line-length=120 .

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit & Logic Tests
        run: flutter test

  build-apk:
    name: Build Android Release APK
    needs: pre-validation-and-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android Wrapper
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew || true
          cd ..
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            flutter create . --project-name accessory_inventory --platforms=android --org=com.dukanspace
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
