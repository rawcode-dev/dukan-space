name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pre-validation-and-audit:
    name: Pre-Validation, Security & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Dependency Hygiene & Security Verification
        run: |
          python3 tool/verify_project.py
          if [ -f "verify_project_report.md" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat verify_project_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Code Formatting Verification
        run: dart format --output=none --line-length=120 .

      - name: Static Analysis & Lint Report
        run: |
          flutter analyze --no-fatal-infos > flutter_analysis.txt 2>&1 || true
          echo "=== RAW FLUTTER ANALYZE OUTPUT ==="
          cat flutter_analysis.txt
          echo "==================================="
          python3 tool/generate_ci_report.py flutter_analysis.txt analysis_report.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat analysis_report.md >> $GITHUB_STEP_SUMMARY
          fi
          if grep -q -E "(error •|error -|warning •|warning -)" flutter_analysis.txt; then
            echo "::error::Flutter analyzer found errors or warnings. Please check the analysis report."
            exit 1
          fi

      - name: Unit & Logic Tests
        run: |
          flutter test --reporter expanded 2>&1 | tee test_output.txt

      - name: Upload Quality & Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-reports
          path: |
            flutter_analysis.txt
            analysis_report.md
            verify_project_report.md
            test_output.txt

  build-apk:
    name: Build Android Release APK
    needs: pre-validation-and-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android Wrapper
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew || true
          cd ..
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            flutter create . --project-name accessory_inventory --platforms=android --org=com.dukanspace
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
