name: CI Pre-Validation & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-validation:
    name: Pre-Validation, Security & Clean Code Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Step 1 - Dependency Hygiene & Security Verification
        run: python3 tool/verify_project.py

      - name: Step 2 - Code Formatting Verification
        run: dart format --output=none --line-length=120 .

      - name: Step 3 - Static Analysis & Lint Report Generation
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee flutter_analysis.txt
          ANALYZER_EXIT=${PIPESTATUS[0]}
          set -e
          python3 tool/generate_ci_report.py flutter_analysis.txt analysis_report.md
          if [ $ANALYZER_EXIT -ne 0 ]; then
            echo "❌ Flutter analyzer found errors! See summary report above."
            exit $ANALYZER_EXIT
          fi

      - name: Step 4 - Unit & Logic Regression Tests
        run: flutter test

      - name: Upload Quality & Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-audit-reports
          path: |
            flutter_analysis.txt
            analysis_report.md
            verify_project_report.md
