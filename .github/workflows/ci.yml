name: CI Pre-Validation & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-validation:
    name: Pre-Validation, Security & Clean Code Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Step 1 - Dependency Hygiene & Security Verification
        run: |
          python3 tool/verify_project.py
          if [ -f "verify_project_report.md" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat verify_project_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Step 2 - Code Formatting Verification
        run: dart format --output=none --line-length=120 .

      - name: Step 3 - Static Analysis & Lint Report
        run: |
          flutter analyze --no-fatal-infos > flutter_analysis.txt 2>&1 || true
          echo "=== RAW FLUTTER ANALYZE OUTPUT ==="
          cat flutter_analysis.txt
          echo "==================================="
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::warning title=Analyzer Output::$line"
            fi
          done < flutter_analysis.txt
          python3 tool/generate_ci_report.py flutter_analysis.txt analysis_report.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat analysis_report.md >> $GITHUB_STEP_SUMMARY
          fi
          if grep -q -E "(error •|error -|warning •|warning -)" flutter_analysis.txt; then
            echo "::error::Flutter analyzer found errors or warnings. Please check the analysis report."
            exit 1
          fi

      - name: Step 4 - Unit & Logic Regression Tests
        run: flutter test

      - name: Upload Quality & Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-audit-reports
          path: |
            flutter_analysis.txt
            analysis_report.md
            verify_project_report.md
