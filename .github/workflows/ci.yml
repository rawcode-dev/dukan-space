name: CI Pre-Validation & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-validation:
    name: Pre-Validation, Security & Clean Code Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Step 1 - Dependency Hygiene & Security Verification
        run: python3 tool/verify_project.py

      - name: Step 2 - Code Formatting Verification
        run: dart format --output=none --line-length=120 .

      - name: Step 3 - Static Analysis & Lints
        run: flutter analyze --no-fatal-infos

      - name: Step 4 - Unit & Logic Regression Tests
        run: flutter test
